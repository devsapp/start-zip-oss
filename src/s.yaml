edition: 3.0.0
name: Zip OSS
access: '{{ access }}'


vars:
  region: "{{ region }}"

resources:
  fc-zip-oss-service:
    component: fc3
    props:
      region: ${vars.region}
      handler: main.main_handler
      timeout: 1800
      runtime: python3.9
      cpu: 1
      memorySize: 3072
      diskSize: 512
      role: '{{ roleArn }}'
      internetAccess: true
      functionName: '{{ functionName }}'
      code: ./code
      logConfig: auto
      triggers:
        - triggerName: http-test
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods:
              - GET
              - POST
              - PUT
